. concurrency:name: Recover FPL Signal Ethiopia Source #1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Recover and verify source
        shell: bash
        run: |
          set -Eeuo pipefail

          RECOVERY_FILE="FPL-Signal-Ethiopia-recovery.txt"
          B64="/tmp/fpl-recovery.b64"
          ZIP="/tmp/fpl-recovery.zip"
          OUT="/tmp/fpl-recovered"

          echo "=== FPL SIGNAL ETHIOPIA SOURCE RECOVERY ==="

          test -f "$RECOVERY_FILE"

          echo "[1/6] Extracting Base64..."
          awk '
            /^BASE64-BEGIN$/ { inside=1; next }
            /^BASE64-END$/   { inside=0; exit }
            inside { print }
          ' "$RECOVERY_FILE" > "$B64"

          test -s "$B64"

          echo "[2/6] Decoding ZIP..."
          python3 - "$B64" "$ZIP" <<'PY'
          import base64
          import sys

          src = sys.argv[1]
          dst = sys.argv[2]

          with open(src, "rb") as f:
              data = b"".join(f.read().split())

          decoded = base64.b64decode(data, validate=True)

          if not decoded.startswith(b"PK"):
              raise SystemExit("ERROR: decoded data is not a ZIP archive")

          with open(dst, "wb") as f:
              f.write(decoded)

          print(f"Decoded ZIP size: {len(decoded)} bytes")
          PY

          echo "[3/6] Testing ZIP..."
          unzip -t "$ZIP"

          echo "[4/6] Extracting..."
          rm -rf "$OUT"
          mkdir -p "$OUT"
          unzip -q "$ZIP" -d "$OUT"

          echo "[5/6] Verifying recovered structure..."

          required=(
            "package.json"
            "pnpm-workspace.yaml"
            "artifacts/api-server"
            "artifacts/fpl-signal-mini-app"
            "lib/db"
            "lib/api-zod"
            "lib/api-client-react"
            "lib/api-spec"
          )

          for path in "${required[@]}"; do
            if [ ! -e "$OUT/$path" ]; then
              echo "ERROR: Missing required path: $path"
              exit 1
            fi
          done

          echo "SOURCE STRUCTURE VERIFIED"

          echo "[6/6] Replacing repository source..."

          rm -rf artifacts lib scripts
          cp -a "$OUT/artifacts" .
          cp -a "$OUT/lib" .

          if [ -d "$OUT/scripts" ]; then
            cp -a "$OUT/scripts" .
          fi

          for file in \
            package.json \
            pnpm-workspace.yaml \
            pnpm-lock.yaml \
            tsconfig.json \
            tsconfig.base.json \
            turbo.json \
            .gitignore \
            .prettierrc \
            replit.md
          do
            if [ -f "$OUT/$file" ]; then
              cp "$OUT/$file" "$file"
            fi
          done

          rm -f "$RECOVERY_FILE"

          rm -f "$B64" "$ZIP"
          rm -rf "$OUT"

          echo "=== SOURCE RECOVERY COMPLETE ==="

      - name: Commit recovered source
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No source changes detected."
            exit 0
          fi

          git commit -m "Recover original FPL Signal Ethiopia source"

          git push origin HEAD:main

          echo "=== RECOVERED SOURCE PUSHED SUCCESSFULLY ==="
